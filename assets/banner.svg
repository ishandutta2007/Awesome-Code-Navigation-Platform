<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #58a6ff;
    }
    .node-dot {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.9; transform: scale(1.02); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .flow-line {
      stroke: #388bfd;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dash 2s linear infinite;
      opacity: 0.5;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowGrad)"/>

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <g opacity="0.25">
    <!-- Grid Pattern -->
    <path d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240" stroke="#30363d" stroke-width="1"/>
    <path d="M 200 0 L 200 320 M 400 0 L 400 320 M 600 0 L 600 320 M 800 0 L 800 320 M 1000 0 L 1000 320" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Animated Code Graph Network Connections (Background layer) -->
  <g class="node-dot">
    <path d="M 150 250 L 300 220 L 500 260 L 800 230 L 1050 260" class="flow-line"/>
    <path d="M 100 80 L 350 100 L 700 70 L 950 110" class="flow-line"/>

    <circle cx="150" cy="250" r="6" fill="#58a6ff" opacity="0.6"/>
    <circle cx="300" cy="220" r="8" fill="#bc8cff" opacity="0.7"/>
    <circle cx="500" cy="260" r="5" fill="#3fb950" opacity="0.6"/>
    <circle cx="800" cy="230" r="7" fill="#d29922" opacity="0.7"/>
    <circle cx="1050" cy="260" r="6" fill="#58a6ff" opacity="0.6"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 115)">
    <!-- Main Title -->
    <text x="0" y="0" class="title">Awesome Code Navigation Platform 🚀</text>
    
    <!-- Subtitle -->
    <text x="0" y="38" class="subtitle">Curated SaaS &amp; Open-Source Ecosystem for Code Search, Symbol Navigation &amp; Intelligence</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="pill-text">🔍 Code Search</text>

      <!-- Pill 2 -->
      <rect x="152" y="0" width="168" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="236" y="20" text-anchor="middle" class="pill-text" fill="#bc8cff">⚡ Symbol Indexing</text>

      <!-- Pill 3 -->
      <rect x="332" y="0" width="170" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="417" y="20" text-anchor="middle" class="pill-text" fill="#3fb950">🧠 Code Intelligence</text>

      <!-- Pill 4 -->
      <rect x="514" y="0" width="140" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="584" y="20" text-anchor="middle" class="pill-text" fill="#d29922">🌐 Open Source</text>
    </g>
  </g>
</svg>
