<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#090d11"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#3fb950"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f6feb" stop-opacity=".3"/><stop offset="100%" stop-color="#8957e5" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}.pill-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#8b949e}.pill-text{font-weight:600;font-size:13px;fill:#58a6ff}.node-dot{animation:pulse 3s infinite alternate ease-in-out}.flow-line{stroke:#388bfd;stroke-width:2;stroke-dasharray:6 6;animation:dash 2s linear infinite;opacity:.5}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#glowGrad)" rx="16"/><g opacity=".25"><path stroke="#30363d" stroke-width="1" d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240"/><path stroke="#30363d" stroke-width="1" d="M 200 0 L 200 320 M 400 0 L 400 320 M 600 0 L 600 320 M 800 0 L 800 320 M 1000 0 L 1000 320"/></g><g class="node-dot"><path d="M 150 250 L 300 220 L 500 260 L 800 230 L 1050 260" class="flow-line"/><path d="M 100 80 L 350 100 L 700 70 L 950 110" class="flow-line"/><circle cx="150" cy="250" r="6" fill="#58a6ff" opacity=".6"/><circle cx="300" cy="220" r="8" fill="#bc8cff" opacity=".7"/><circle cx="500" cy="260" r="5" fill="#3fb950" opacity=".6"/><circle cx="800" cy="230" r="7" fill="#d29922" opacity=".7"/><circle cx="1050" cy="260" r="6" fill="#58a6ff" opacity=".6"/></g><rect width="1200" height="6" x="0" y="0" fill="url(#accentGrad)"/><g><text x="0" y="0" class="title" transform="translate(60, 115)">Awesome Code Navigation Platform 🚀</text><text x="0" y="38" class="subtitle" transform="translate(60, 115)">Curated SaaS &amp; Open-Source Ecosystem for Code Search, Symbol Navigation &amp; Intelligence</text><g transform="translate(60, 115) translate(0, 75)"><rect width="140" height="32" x="0" y="0" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="16"/><text x="70" y="20" class="pill-text" text-anchor="middle">🔍 Code Search</text><rect width="168" height="32" x="152" y="0" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="16"/><text x="236" y="20" fill="#bc8cff" class="pill-text" text-anchor="middle">⚡ Symbol Indexing</text><rect width="170" height="32" x="332" y="0" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="16"/><text x="417" y="20" fill="#3fb950" class="pill-text" text-anchor="middle">🧠 Code Intelligence</text><rect width="140" height="32" x="514" y="0" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="16"/><text x="584" y="20" fill="#d29922" class="pill-text" text-anchor="middle">🌐 Open Source</text></g></g></svg>